# Chạy: docker compose up -d   (trong thư mục server)
# API PHP: http://localhost:8080  (máy ảo Android gọi http://10.0.2.2:8080)
# MySQL: localhost:3307 (DBeaver; 3307 để không trùng MySQL khác trên máy)
# App Android -> API PHP (thư mục ./api) -> MySQL
name: quanlycafe

services:
  mysql:
    image: mysql:8.4
    container_name: quanlycafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Ho_Chi_Minh
    command:
      - "--default-time-zone=+07:00"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      # Driver JDBC trên Android (Connector/J 5.1) chỉ hỗ trợ kiểu đăng nhập mysql_native_password
      - "--mysql-native-password=ON"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: php:8.3-apache
    container_name: quanlycafe-api
    restart: unless-stopped
    # Cài pdo_mysql rồi chạy Apache (cổng 80 trong container)
    command: sh -c "docker-php-ext-install pdo_mysql >/dev/null && apache2-foreground"
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
